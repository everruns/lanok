<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- The band is opaque so every label inside it keeps its contrast on a dark
       page background as well as a light one. -->
  <rect x="196" y="70" width="328" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- initiator -->
  <rect x="16" y="70" width="180" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="106" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Peer A</text>
  <text x="106" y="124" text-anchor="middle" font-size="12" fill="#475569">initiator</text>
  <line x1="40" y1="142" x2="172" y2="142" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="106" y="168" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">SENDS</text>
  <text x="106" y="186" text-anchor="middle" font-size="12" fill="#1e3a8a">echo · ping</text>
  <text x="106" y="220" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">ANSWERS</text>
  <text x="106" y="238" text-anchor="middle" font-size="12" fill="#9a3412">ui/ask</text>

  <!-- responder -->
  <rect x="524" y="70" width="180" height="200" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="614" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Peer B</text>
  <text x="614" y="124" text-anchor="middle" font-size="12" fill="#475569">responder</text>
  <line x1="548" y1="142" x2="680" y2="142" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="614" y="168" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">SENDS</text>
  <text x="614" y="186" text-anchor="middle" font-size="12" fill="#9a3412">ui/ask</text>
  <text x="614" y="220" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">ANSWERS</text>
  <text x="614" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">echo · ping</text>

  <!-- forward request and its response -->
  <text x="360" y="100" text-anchor="middle" font-size="12" fill="#1e40af">echo · ping</text>
  <line x1="212" y1="112" x2="508" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#forward)"/>
  <text x="360" y="142" text-anchor="middle" font-size="12" fill="#1e40af">result</text>
  <line x1="508" y1="154" x2="212" y2="154" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#forward)"/>

  <!-- the reverse request, sent by the responder, and its response -->
  <text x="360" y="196" text-anchor="middle" font-size="12" fill="#9a3412">ui/ask</text>
  <line x1="508" y1="208" x2="212" y2="208" stroke="#b45309" stroke-width="2" marker-end="url(#reverse)"/>
  <text x="360" y="238" text-anchor="middle" font-size="12" fill="#9a3412">result</text>
  <line x1="212" y1="250" x2="508" y2="250" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#reverse)"/>

  <text x="360" y="292" text-anchor="middle" font-size="11" fill="#64748b">one connection · each direction owns its own id space</text>
</svg>
