<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="reverse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Every text element sits on a fill this file draws, so the diagram reads
       on GitHub's light and dark pages alike. Prose belongs in the markdown
       beside the embed, not floating on a transparent background here. -->
  <rect x="196" y="20" width="328" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- initiator -->
  <rect x="16" y="20" width="180" height="200" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="106" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Peer A</text>
  <text x="106" y="74" text-anchor="middle" font-size="12" fill="#475569">initiator</text>
  <line x1="40" y1="92" x2="172" y2="92" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="106" y="118" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">SENDS</text>
  <text x="106" y="136" text-anchor="middle" font-size="12" fill="#1e3a8a">echo · ping</text>
  <text x="106" y="170" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">ANSWERS</text>
  <text x="106" y="188" text-anchor="middle" font-size="12" fill="#9a3412">ui/ask</text>

  <!-- responder -->
  <rect x="524" y="20" width="180" height="200" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="614" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Peer B</text>
  <text x="614" y="74" text-anchor="middle" font-size="12" fill="#475569">responder</text>
  <line x1="548" y1="92" x2="680" y2="92" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="614" y="118" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">SENDS</text>
  <text x="614" y="136" text-anchor="middle" font-size="12" fill="#9a3412">ui/ask</text>
  <text x="614" y="170" text-anchor="middle" font-size="10" letter-spacing="0.08em" fill="#64748b">ANSWERS</text>
  <text x="614" y="188" text-anchor="middle" font-size="12" fill="#1e3a8a">echo · ping</text>

  <!-- forward request and its response -->
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#1e40af">echo · ping</text>
  <line x1="212" y1="62" x2="508" y2="62" stroke="#2563eb" stroke-width="2" marker-end="url(#forward)"/>
  <text x="360" y="92" text-anchor="middle" font-size="12" fill="#1e40af">result</text>
  <line x1="508" y1="104" x2="212" y2="104" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#forward)"/>

  <!-- the reverse request, sent by the responder, and its response -->
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#9a3412">ui/ask</text>
  <line x1="508" y1="158" x2="212" y2="158" stroke="#b45309" stroke-width="2" marker-end="url(#reverse)"/>
  <text x="360" y="188" text-anchor="middle" font-size="12" fill="#9a3412">result</text>
  <line x1="212" y1="200" x2="508" y2="200" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#reverse)"/>
</svg>
