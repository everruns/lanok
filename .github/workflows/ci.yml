name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: License & source check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check licenses sources bans

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test whole workspace
        run: cargo test --workspace --all-features

      - name: Doc tests
        run: cargo test --workspace --all-features --doc

      # lanok-core is the crate every protocol's wire types depend on. Building
      # it alone proves it still compiles without tokio, schemars, or any of
      # the peer's dependencies in the graph.
      - name: lanok-core stays dependency-light
        run: |
          cargo tree -p lanok-core --edges normal --prefix none \
            | sed 's/ .*//' | sort -u > /tmp/core-deps.txt
          cat /tmp/core-deps.txt
          for forbidden in tokio async-trait schemars clap; do
            if grep -qx "$forbidden" /tmp/core-deps.txt; then
              echo "lanok-core must not depend on $forbidden"
              exit 1
            fi
          done

      # The committed schema artifacts are generated from the protocol
      # declaration; fail if a protocol change landed without regenerating them.
      - name: Schema artifacts are up to date
        run: cargo run -q -p echo-protocol --bin echo-schema-gen -- --check

  example:
    name: Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # End-to-end over a real child process: a client spawns a server, runs the
      # handshake, calls forward, and answers a reverse request. This is the
      # peer's only true integration coverage, so it must stay green.
      - name: Echo example (async server)
        run: cargo run -q -p echo-protocol --bin echo-client

      - name: Echo example (blocking SimpleServer)
        run: cargo run -q -p echo-protocol --bin echo-client -- --blocking

      # Replay the committed conformance vectors against the server process, the
      # same way a non-Rust implementation is checked.
      - name: Conformance vectors
        run: |
          cargo build -q -p echo-protocol --bin echo-server
          cargo run -q -p lanok-cli -- conform \
            --vectors examples/echo/schema/v1/conformance.json -- ./target/debug/echo-server

  sdks:
    name: SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The generated wire types come from the committed schema; fail if a
      # protocol change landed without regenerating them.
      - name: Python SDK is in sync with the schema
        run: |
          cargo run -q -p lanok-cli -- gen python \
            --schema examples/echo/schema/v1 \
            --out sdks/python/lanok/_generated_echo.py --check

      - name: Python SDK tests
        run: |
          python3 -m pip install --quiet pytest
          cd sdks/python && python3 -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: TypeScript SDK is in sync with the schema
        run: |
          cargo run -q -p lanok-cli -- gen typescript \
            --schema examples/echo/schema/v1 \
            --out sdks/typescript/src/generatedEcho.ts --check

      - name: TypeScript SDK build + tests
        run: cd sdks/typescript && npm ci && npm test

  # Gate job for branch protection. The name must stay "Check".
  check:
    name: Check
    if: always()
    needs: [lint, audit, test, example, sdks]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.example.result }}" != "success" ]] || \
             [[ "${{ needs.sdks.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
